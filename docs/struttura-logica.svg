<text x="134" y="80" font-size="16" fill="#4A5A73">Struttura logica del progetto</text>

<text x="84" y="130" font-size="14" font-weight="700" fill="#005F73" letter-spacing="2">ATTORI</text>
<g font-size="19" font-weight="700" fill="#F8F9FA" text-anchor="middle">
<rect x="84" y="142" width="240" height="72" rx="12" fill="#1D3557"/><text x="204" y="173">Ospite occasionale</text>
<rect x="348" y="142" width="240" height="72" rx="12" fill="#1D3557"/><text x="468" y="173">Stagionale</text>
<rect x="612" y="142" width="240" height="72" rx="12" fill="#1D3557"/><text x="732" y="173">Gestore del bagno</text>
<rect x="876" y="142" width="240" height="72" rx="12" fill="#1D3557"/><text x="996" y="173">Reception</text>
</g>
<g font-size="14" fill="#E0F2F1" text-anchor="middle">
<text x="204" y="195">Cerca, prenota, paga</text>
<text x="468" y="195">Libera le sue giornate</text>
<text x="732" y="195">Autorizza e fissa le regole</text>
<text x="996" y="195">Verifica il pass all'arrivo</text>
</g>
