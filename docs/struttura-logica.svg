<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" role="img" font-family="'Plus Jakarta Sans', 'Liberation Sans', Arial, Helvetica, sans-serif">
<title>Ombrè — struttura logica del progetto</title>
<desc>Quattro attori usano quattro superfici, che parlano con un'unica API composta da otto moduli di dominio. L'API scrive su PostgreSQL, da cui un worker con outbox raggiunge i provider esterni; i webhook di pagamento rientrano nell'API.</desc>
<defs>
<marker id="freccia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#023047"/></marker>
<marker id="freccia-mare" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#126777"/></marker>
</defs>
<rect width="1200" height="830" fill="#FFF8E7"/>

<g transform="translate(60 28) scale(0.25)">
<path d="M120 30v160" stroke="#023047" stroke-width="10" stroke-linecap="round" fill="none"/>
<path d="M120 38c-52 0-94 38-94 86h188c0-48-42-86-94-86z" fill="#FFB703"/>
<circle cx="49.5" cy="124" r="23.5" fill="#FFF8E7"/><circle cx="96.5" cy="124" r="23.5" fill="#FFF8E7"/><circle cx="143.5" cy="124" r="23.5" fill="#FFF8E7"/><circle cx="190.5" cy="124" r="23.5" fill="#FFF8E7"/>
<path d="M34 206c14-16 30-16 44 0s30 16 44 0 30-16 44 0 30 16 40 0" fill="none" stroke="#126777" stroke-width="12" stroke-linecap="round"/>
