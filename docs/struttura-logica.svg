<text x="84" y="130" font-size="14" font-weight="700" fill="#126777" letter-spacing="2">ATTORI</text>
<g font-size="19" font-weight="700" fill="#FFF8E7" text-anchor="middle">
<rect x="84" y="142" width="240" height="72" rx="12" fill="#023047"/><text x="204" y="173">Ospite occasionale</text>
<rect x="348" y="142" width="240" height="72" rx="12" fill="#023047"/><text x="468" y="173">Stagionale</text>
<rect x="612" y="142" width="240" height="72" rx="12" fill="#023047"/><text x="732" y="173">Gestore del bagno</text>
<rect x="876" y="142" width="240" height="72" rx="12" fill="#023047"/><text x="996" y="173">Reception</text>
